# .github/workflows/keep-alive.yml
# ============================================================================
# KEEP ALIVE — Prevents GitHub from disabling scheduled workflows
# ============================================================================
# GitHub automatically disables scheduled workflows on repos with no activity
# for 60 days. This workflow runs on the 1st of every month, commits a
# timestamp file, and resets the 60-day clock — keeping the Weekly Earnings
# Batch workflow permanently active.
#
# Setup: Just add this file to .github/workflows/ — no secrets needed.
# ============================================================================

name: Keep Alive

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write timestamp and commit
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          echo "Last keep-alive: $(date -u)" > .keep-alive
          git add .keep-alive
          git diff --staged --quiet || git commit -m "chore: keep-alive $(date -u '+%Y-%m')"
          git push

      - name: Confirm
        run: echo "Keep-alive commit pushed — 60-day clock reset"